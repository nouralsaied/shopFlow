<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products — ShopFlow</title>

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />

    <script>
      const t = localStorage.getItem("shopflow-theme");
      if (t) document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="app-header"></div>

    <main id="main">
      <section class="page-hero">
        <div class="container">
          <h1 id="page-title">Products</h1>
          <p>Discover our full collection</p>
        </div>
      </section>

      <div class="container products-layout">
        <aside class="filters" id="filters">
          <div class="filters-head">
            <button
              type="button"
              class="filters-toggle"
              id="filters-toggle"
              aria-expanded="false"
            >
              Filters <span class="chev">▾</span>
            </button>
            <button type="button" class="link-btn" id="reset-btn">Reset</button>
          </div>

          <div class="filter-group">
            <h3>Category</h3>
            <div id="category-list"></div>
          </div>

          <div class="filter-group">
            <h3>Price Range</h3>
            <input
              type="range"
              id="price-range"
              min="0"
              max="1000"
              value="1000"
            />
            <div class="price-label">
              $0 - $<span id="price-value">1000</span>
            </div>
          </div>

          <div class="filter-group">
            <h3>Rating</h3>
            <label class="check"
              ><input type="radio" name="rating" value="0" checked /> Any</label
            >
            <label class="check"
              ><input type="radio" name="rating" value="4" /> ★★★★ &amp;
              up</label
            >
            <label class="check"
              ><input type="radio" name="rating" value="3" /> ★★★ &amp;
              up</label
            >
            <label class="check"
              ><input type="radio" name="rating" value="2" /> ★★ &amp; up</label
            >
          </div>
        </aside>

        <section class="results">
          <div class="toolbar">
            <input
              type="search"
              id="search-input"
              placeholder="Search products..."
              aria-label="Search products"
            />
            <select id="sort-select" aria-label="Sort products">
              <option value="popularity">Sort by: Popularity</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Rating</option>
              <option value="name">Name (A-Z)</option>
            </select>
          </div>

          <p class="result-count" id="result-count"></p>
          <div id="results"></div>
          <nav class="pagination" id="pagination" aria-label="Product pages" hidden></nav>
        </section>
      </div>
    </main>

    <div id="app-footer"></div>

    <script type="module" src="js/pages/products.js"></script>
  </body>
</html>
