<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopFlow</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script>
    const t = localStorage.getItem("shopflow-theme");
    if (t) document.documentElement.dataset.theme = t;
  </script>
</head>
<body>
  <div id="app-header"></div>

  <main id="main">

    <section class="hero">
      <div class="container">
        <h1>ShopFlow</h1>
        <h2>Better Products. A Brighter You.</h2>
        <p>Discover amazing products, great prices and a seamless shopping experience.</p>
        <a href="products.html" class="btn">Shop Now →</a>
      </div>
    </section>

    <section class="features">
      <div class="container features-inner">
        <div class="feature">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></svg>
          </div>
          <div><strong>Free Shipping</strong><span>On orders over $50</span></div>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div><strong>Secure Payment</strong><span>100% protected</span></div>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </div>
          <div><strong>Easy Returns</strong><span>Within 30 days</span></div>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-7h3zM3 19a2 2 0 0 0 2 2h1v-7H3z"/></svg>
          </div>
          <div><strong>24/7 Support</strong><span>We're here to help</span></div>
        </div>
      </div>
    </section>

    <section class="container section">
      <div class="section-head">
        <h2>Featured Products</h2>
        <a href="products.html" class="link-more">View All →</a>
      </div>
      <div id="featured"></div>
    </section>

  </main>

  <div id="app-footer"></div>

  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
